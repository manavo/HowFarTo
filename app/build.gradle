plugins {
    id "com.android.application"
}

// Maps API key comes from the MAPS_API_KEY env var (CI) or local.properties (local builds)
def mapsApiKey = System.getenv("MAPS_API_KEY")
if (mapsApiKey == null) {
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }
    mapsApiKey = localProperties.getProperty("MAPS_API_KEY", "")
}

android {
    namespace "com.manavo.HowFarTo"
    compileSdk 36

    defaultConfig {
        applicationId "com.manavo.HowFarTo"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.2.1"
        resValue "string", "maps_api_key", mapsApiKey
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation "com.google.android.gms:play-services-location:21.4.0"
}
